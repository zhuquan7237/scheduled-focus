# https://docs.devin.ai/onboard-devin/environment-yaml
# One-time setup (e.g., install system tools, global CLIs).
initialize:
  - name: Install Android SDK (cmdline-tools, platform 35, build-tools 35)
    run: |
      set -e
      export ANDROID_HOME="$HOME/android-sdk"
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -fsSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        rm -rf /tmp/clt && unzip -q /tmp/clt.zip -d /tmp/clt
        mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
        rm -rf /tmp/clt /tmp/clt.zip
      fi
      yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      echo "ANDROID_HOME=$ANDROID_HOME" >> $ENVRC
      echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $ENVRC
      echo "PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:\$PATH" >> $ENVRC
  - name: Route Maven Central through Google's mirror (repo.maven.apache.org returns 429 from Devin VMs)
    run: |
      mkdir -p ~/.gradle/init.d
      cat > ~/.gradle/init.d/maven-central-mirror.gradle <<'GRADLE'
      def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
      beforeSettings { settings ->
          settings.pluginManagement.repositories { maven { name = 'centralMirror'; url = mirror } }
          settings.dependencyResolutionManagement.repositories { maven { name = 'centralMirror'; url = mirror } }
      }
      GRADLE
# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance:
  - name: Warm Gradle wrapper and dependency cache
    run: |
      export ANDROID_HOME="$HOME/android-sdk"
      chmod +x gradlew
      ./gradlew :app:dependencies --console=plain > /dev/null
knowledge:
  - name: test
    contents: |
      ./gradlew testDebugUnitTest --console=plain   # pure JVM rule tests
  - name: lint
    contents: |
      ./gradlew lintDebug --console=plain
  - name: build
    contents: |
      ./gradlew assembleDebug --console=plain   # APK at app/build/outputs/apk/debug/app-debug.apk; CI runs `testDebugUnitTest lintDebug assembleDebug`
  - name: notes
    contents: |
      Emulator integration tests: `./gradlew connectedDebugAndroidTest` (needs a running emulator/AVD, not installed by this blueprint). assembleRelease needs the private signing key via FOCUS_KEYSTORE/FOCUS_STORE_PASSWORD/FOCUS_KEY_ALIAS/FOCUS_KEY_PASSWORD; use debug builds otherwise. WeChat test fixture is opt-in with `-PwechatFixture=true`.
