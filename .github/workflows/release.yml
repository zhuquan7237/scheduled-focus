name: Signed Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/focus.jks"
      - name: Check and build
        env:
          FOCUS_KEYSTORE: ${{ runner.temp }}/focus.jks
          FOCUS_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          FOCUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FOCUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease --console=plain
          VERSION=$(sed -n 's/.*versionName = .*?: "\([^"]*\)"/\1/p' app/build.gradle.kts)
          test "v$VERSION" = "$GITHUB_REF_NAME"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/scheduled-focus-$GITHUB_REF_NAME.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt --title "定时专注 $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --verify-tag
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/focus.jks"
